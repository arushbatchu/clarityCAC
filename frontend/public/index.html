<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Clarity — Rapid Triage for Uncertain Moments</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e0c">
<meta name="application-name" content="Clarity">
<meta name="description" content="Rapid triage decision support for the ten seconds between noticing a symptom and knowing what to do.">

<!-- iOS -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clarity">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Android / generic -->
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700;9..144,800&family=JetBrains+Mono:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f4f2ed;
  --bg-deep: #ebe8e0;
  --ink: #0e0e0c;
  --ink-soft: #3a3a35;
  --ink-mute: #7a7a70;
  --paper: #fafaf6;
  --green: #1f6b3a;
  --green-bg: #dce8d5;
  --green-ink: #0d3a1f;
  --amber: #b25c00;
  --amber-bg: #f4e3c1;
  --amber-ink: #5c2e00;
  --red: #9b1b1b;
  --red-bg: #f2cfcf;
  --red-ink: #5e0e0e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter Tight', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

/* ===================== STAGE ===================== */
.stage {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 1fr minmax(390px, 420px) 1fr;
  align-items: center;
  padding: 32px;
  gap: 36px;
  background:
    radial-gradient(circle at 18% 12%, rgba(155,27,27,0.035), transparent 42%),
    radial-gradient(circle at 82% 82%, rgba(31,107,58,0.035), transparent 48%),
    var(--bg);
}
.side { font-family: 'Fraunces', serif; max-width: 380px; }
.side.left  { justify-self: end;   text-align: right; }
.side.right { justify-self: start; }

.brand {
  font-family: 'Fraunces', serif;
  font-weight: 300;
  font-size: 68px;
  line-height: 0.88;
  letter-spacing: -0.04em;
  font-style: italic;
}
.brand em {
  font-weight: 700; font-style: normal;
  background: var(--ink); color: var(--paper);
  padding: 2px 10px 8px; display: inline-block; transform: rotate(-1deg);
}
.tagline {
  margin-top: 22px;
  font-family: 'Inter Tight', sans-serif;
  font-size: 12px; line-height: 1.5;
  color: var(--ink-soft);
  text-transform: uppercase; letter-spacing: 0.14em;
}
.problem-frame {
  margin-top: 28px; padding-top: 20px;
  border-top: 2px solid var(--ink);
}
.problem-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em;
  color: var(--ink-mute); text-transform: uppercase;
}
.problem-text {
  margin-top: 6px;
  font-family: 'Fraunces', serif;
  font-weight: 400; font-size: 19px; line-height: 1.2;
  letter-spacing: -0.015em; color: var(--ink);
}
.problem-text em { font-style: italic; background: var(--red-bg); padding: 0 4px; }

.meta-box {
  margin-top: 24px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-mute); letter-spacing: 0.06em;
  line-height: 1.7;
}

.principle {
  border-top: 2px solid var(--ink);
  padding-top: 14px; margin-top: 22px;
}
.principle .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-mute); letter-spacing: 0.12em;
}
.principle .txt {
  font-family: 'Fraunces', serif;
  font-weight: 400; font-size: 20px; line-height: 1.18;
  letter-spacing: -0.015em; margin-top: 5px;
}

/* ===================== PHONE ===================== */
.phone {
  width: 390px; height: 820px;
  background: var(--ink); border-radius: 50px;
  padding: 10px; justify-self: center;
  box-shadow:
    0 1px 0 rgba(255,255,255,0.25) inset,
    0 40px 80px -20px rgba(0,0,0,0.35),
    0 20px 40px -15px rgba(0,0,0,0.2);
  position: relative;
}
.phone::before {
  content:''; position: absolute; top: 20px; left: 50%;
  transform: translateX(-50%);
  width: 108px; height: 28px;
  background: var(--ink); border-radius: 20px; z-index: 10;
}
.screen {
  width: 100%; height: 100%;
  background: var(--paper); border-radius: 42px;
  overflow: hidden; position: relative;
  display: flex; flex-direction: column;
}
.status-bar {
  height: 44px; flex-shrink: 0;
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 0 28px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 600;
}
.status-icons { display: flex; gap: 5px; align-items: center; }
.status-icons svg { width: 14px; height: 14px; }

.app-head {
  flex-shrink: 0;
  padding: 12px 22px;
  display: flex; justify-content: space-between; align-items: center;
  border-bottom: 1px solid var(--ink);
}
.app-logo {
  font-family: 'Fraunces', serif;
  font-weight: 500; font-size: 19px; letter-spacing: -0.02em;
}
.app-logo em { font-style: italic; font-weight: 300; }
.app-nav { display: flex; gap: 3px; }
.nav-btn {
  padding: 6px 9px; border: 1px solid transparent;
  background: transparent; color: var(--ink-mute); cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase;
  font-weight: 500;
  transition: all 0.15s;
}
.nav-btn:hover { color: var(--ink); }
.nav-btn.active { background: var(--ink); color: var(--paper); }

#app-scroll {
  flex: 1; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: none;
}
#app-scroll::-webkit-scrollbar { display: none; }

.view { display: none; animation: fadeIn 0.35s ease-out; }
.view.active { display: block; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0);   }
}

/* ===================== INPUT SCREEN ===================== */
.hero {
  padding: 22px 22px 8px;
}
.hero-eye {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-mute);
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
#tap-count { color: var(--red); font-weight: 600; }
.hero-title {
  font-family: 'Fraunces', serif;
  font-weight: 400; font-size: 36px; line-height: 1;
  letter-spacing: -0.03em;
}
.hero-title em { font-style: italic; font-weight: 300; }
.hero-title .mark {
  background: var(--ink); color: var(--paper);
  padding: 0 8px 4px; display: inline-block;
  font-weight: 600; font-size: 33px; font-style: normal;
}
.hero-sub {
  margin-top: 10px;
  font-size: 12.5px; line-height: 1.5;
  color: var(--ink-soft);
}

.step {
  padding: 12px 22px 10px;
  border-top: 1px solid rgba(0,0,0,0.08);
}
.step:first-of-type { border-top: 1px solid var(--ink); margin-top: 14px; }
.step-head {
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 10px;
}
.step-num {
  font-family: 'Fraunces', serif;
  font-weight: 600; font-size: 16px;
  letter-spacing: -0.02em;
}
.step-num em {
  font-family: 'JetBrains Mono', monospace;
  font-weight: 500; font-size: 9px;
  color: var(--ink-mute);
  letter-spacing: 0.14em; text-transform: uppercase;
  margin-right: 6px;
}

/* Scenario grid */
.scenario-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}
.scenario-chip {
  padding: 10px 11px;
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter Tight', sans-serif;
  text-align: left; cursor: pointer;
  transition: all 0.15s;
  display: flex; flex-direction: column; gap: 3px;
}
.scenario-chip:hover { background: var(--bg-deep); }
.scenario-chip.active {
  background: var(--ink); color: var(--paper);
  transform: scale(0.98);
}
.sc-cat {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-mute);
}
.scenario-chip.active .sc-cat { color: rgba(250,250,246,0.55); }
.sc-label {
  font-size: 12px; font-weight: 500; line-height: 1.15;
}

/* Severity slider */
.sev-row {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 6px;
}
#severity {
  flex: 1;
  -webkit-appearance: none; appearance: none;
  height: 3px; background: var(--ink); outline: none;
}
#severity::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 22px; height: 22px; background: var(--red);
  border: 2px solid var(--ink); cursor: pointer;
  border-radius: 0; transition: transform 0.1s;
}
#severity::-webkit-slider-thumb:hover { transform: scale(1.12); }
#severity::-moz-range-thumb {
  width: 22px; height: 22px; background: var(--red);
  border: 2px solid var(--ink); cursor: pointer; border-radius: 0;
}
#severity-dots {
  display: flex; gap: 4px; flex-shrink: 0;
}
.sev-dot {
  width: 9px; height: 9px; background: var(--paper);
  border: 1px solid var(--ink);
}
.sev-dot.filled { background: var(--ink); }
#severity-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-mute);
  letter-spacing: 0.05em;
}

/* Onset pills */
.onset-row { display: flex; gap: 6px; }
.onset-pill {
  flex: 1; padding: 10px;
  border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  font-family: 'Inter Tight', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.onset-pill:hover { background: var(--bg-deep); }
.onset-pill.active {
  background: var(--ink); color: var(--paper);
}
.onset-icon {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; font-weight: 600;
}

/* Symptom chips */
.symptom-chips {
  display: flex; flex-wrap: wrap; gap: 5px;
}
.symptom-chip {
  padding: 7px 10px;
  border: 1px solid var(--ink);
  background: var(--paper); color: var(--ink);
  font-family: 'Inter Tight', sans-serif;
  font-size: 11px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.symptom-chip:hover { background: var(--bg-deep); }
.symptom-chip.active {
  background: var(--ink); color: var(--paper);
}

/* Free text toggle */
.free-toggle-row { margin-top: 10px; }
#free-text-toggle {
  background: none; border: none; padding: 4px 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-mute);
  letter-spacing: 0.1em; cursor: pointer;
}
#free-text-toggle:hover { color: var(--ink); }
#free-text-wrap {
  max-height: 0; overflow: hidden;
  transition: max-height 0.3s ease, margin 0.3s ease;
}
#free-text-wrap.visible { max-height: 120px; margin-top: 8px; }
#free-text {
  width: 100%; padding: 10px;
  border: 1px solid var(--ink); background: var(--paper);
  font-family: 'Fraunces', serif; font-size: 14px;
  resize: none; outline: none;
  min-height: 70px;
}
#free-text::placeholder { color: var(--ink-mute); font-style: italic; }

/* Primary CTA + reset */
.cta-row {
  padding: 14px 22px 18px;
  display: flex; gap: 8px;
  border-top: 1px solid var(--ink);
  background: var(--bg-deep);
}
.cta {
  flex: 1; padding: 14px;
  background: var(--ink); color: var(--paper); border: none;
  font-family: 'Inter Tight', sans-serif;
  font-size: 13px; font-weight: 600; letter-spacing: 0.03em;
  cursor: pointer; transition: all 0.2s;
  display: flex; justify-content: space-between; align-items: center;
}
.cta:hover { background: var(--red); }
.cta .arrow { font-family: 'JetBrains Mono', monospace; }
.cta.ghost {
  flex: 0 0 44px; background: transparent; color: var(--ink);
  border: 1px solid var(--ink); padding: 14px 12px;
  font-family: 'JetBrains Mono', monospace; font-size: 14px;
  justify-content: center;
}
.cta.ghost:hover { background: var(--ink); color: var(--paper); }

#empty-banner {
  margin: 0 22px; padding: 0 12px;
  background: var(--red-bg); color: var(--red-ink);
  font-family: 'JetBrains Mono', monospace; font-size: 10px;
  border-left: 3px solid var(--red);
  max-height: 0; overflow: hidden; opacity: 0;
  transition: all 0.25s;
}
#empty-banner.show {
  max-height: 40px; padding: 8px 12px; opacity: 1;
  margin-bottom: 10px;
}

/* ===================== ANALYZING OVERLAY ===================== */
.analyzing {
  position: absolute; inset: 0; z-index: 50;
  background: var(--paper); border-radius: 42px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s;
}
.analyzing.active { opacity: 1; pointer-events: auto; }
.pulse {
  width: 32px; height: 32px; background: var(--ink);
  border-radius: 50%;
  animation: pulse 1.1s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { transform: scale(0.82); opacity: 0.5; }
  50%      { transform: scale(1.12); opacity: 1;   }
}
.analyzing h2 {
  font-family: 'Fraunces', serif;
  font-style: italic; font-weight: 300;
  font-size: 26px; letter-spacing: -0.02em;
}
#analyze-steps {
  list-style: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.05em;
  min-width: 230px;
}
#analyze-steps li {
  padding: 4px 0; opacity: 0;
  color: var(--ink-mute);
  display: flex; justify-content: space-between;
  transition: opacity 0.2s;
}
#analyze-steps li.done { opacity: 1; color: var(--ink); }
#analyze-steps li.done::after { content: '✓'; color: var(--green); font-weight: 700; }

/* ===================== RESULT SCREEN ===================== */
.result-host { display: flex; flex-direction: column; }

.urgency-banner {
  padding: 22px 22px 20px;
  border-bottom: 1.5px solid var(--ink);
  position: relative;
}
.tier-low  .urgency-banner { background: var(--green-bg); }
.tier-moderate .urgency-banner { background: var(--amber-bg); }
.tier-high .urgency-banner { background: var(--red-bg); }

.urg-meta {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.12em;
}
.urg-tier { font-weight: 700; color: var(--ink); }
.urg-time { color: var(--ink-soft); }
.src-tag {
  display: inline-block; margin-left: 4px;
  padding: 1px 6px; background: var(--ink); color: var(--paper);
  font-size: 8px; letter-spacing: 0.08em;
}
.src-be { background: var(--green); }
.src-lo { background: var(--ink); }

.urg-headline {
  font-family: 'Fraunces', serif;
  font-weight: 700; font-size: 44px; line-height: 0.92;
  letter-spacing: -0.035em; color: var(--ink);
}
.tier-low  .urg-headline { color: var(--green-ink); }
.tier-moderate .urg-headline { color: var(--amber-ink); }
.tier-high .urg-headline { color: var(--red-ink); }

.urg-action {
  margin-top: 10px;
  font-family: 'Fraunces', serif;
  font-weight: 400; font-style: italic;
  font-size: 19px; line-height: 1.3;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.emergency-btn {
  margin-top: 14px; width: 100%;
  padding: 13px;
  background: var(--red); color: white; border: none;
  font-family: 'Inter Tight', sans-serif;
  font-weight: 700; font-size: 14px; letter-spacing: 0.06em;
  text-transform: uppercase; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: all 0.2s;
}
.emergency-btn:hover { background: var(--ink); }
.emergency-dot {
  width: 8px; height: 8px; background: white; border-radius: 50%;
  animation: blink 1s step-start infinite;
}
@keyframes blink { 50% { opacity: 0.3; } }

.block {
  padding: 16px 22px;
  border-bottom: 1px solid var(--ink);
}
.block-title {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-mute);
  margin-bottom: 10px;
  display: flex; justify-content: space-between;
}
.loc-dot {
  color: var(--green); text-transform: none;
  letter-spacing: 0.05em; font-weight: 500;
}
.block-body {
  font-family: 'Fraunces', serif;
  font-size: 14.5px; line-height: 1.5;
  color: var(--ink-soft);
}

.bullets { list-style: none; }
.bullets li {
  padding: 8px 0;
  font-size: 13.5px; line-height: 1.4;
  display: flex; gap: 10px;
  border-bottom: 1px dashed rgba(0,0,0,0.1);
  color: var(--ink);
}
.bullets li:last-child { border-bottom: none; }
.bullets .dash {
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-mute); flex-shrink: 0;
  font-weight: 600;
}
.bullets.warn .dash { color: var(--amber); }

.places { display: flex; flex-direction: column; }
.place {
  padding: 10px 0;
  display: grid; grid-template-columns: 1fr auto; gap: 8px;
  border-bottom: 1px solid var(--ink);
}
.place:last-child { border-bottom: none; }
.place-name {
  font-weight: 600; font-size: 13px; color: var(--ink);
}
.place-kind {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; color: var(--ink-mute);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-top: 2px;
}
.place-dist {
  font-family: 'Fraunces', serif;
  font-weight: 600; font-size: 18px;
  letter-spacing: -0.02em; text-align: right;
}
.place-dist span {
  font-size: 10px; font-weight: 400;
  color: var(--ink-mute);
  font-family: 'JetBrains Mono', monospace;
  margin-left: 2px;
}

/* Reasoning collapsible */
.reasoning-panel {
  border-bottom: 1px solid var(--ink);
  background: var(--bg-deep);
}
.reasoning-panel summary {
  padding: 14px 22px;
  list-style: none; cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  font-weight: 600; color: var(--ink);
  transition: background 0.15s;
}
.reasoning-panel summary::-webkit-details-marker { display: none; }
.reasoning-panel summary::before {
  content: '+'; margin-right: 8px;
  font-family: 'JetBrains Mono', monospace; font-weight: 700;
}
.reasoning-panel[open] summary::before { content: '−'; }
.reasoning-panel summary:hover { background: rgba(0,0,0,0.04); }
.sum-meta { color: var(--ink-mute); font-weight: 400; }

.sig-list { padding: 4px 22px 16px; }
.sig-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 0;
  border-bottom: 1px dashed rgba(0,0,0,0.1);
  font-size: 12px;
}
.sig-row:last-child { border-bottom: none; }
.sig-label {
  font-family: 'Inter Tight', sans-serif;
  color: var(--ink);
}
.sig-weight {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 600;
  padding: 2px 6px;
  color: var(--paper);
}
.sig-weight.w-low  { background: var(--ink-mute); }
.sig-weight.w-med  { background: var(--amber); }
.sig-weight.w-high { background: var(--red); }

.esc-note {
  margin: 0 22px 14px; padding: 10px 12px;
  background: var(--amber-bg);
  border-left: 3px solid var(--amber);
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; line-height: 1.5;
  color: var(--amber-ink);
}

.result-actions {
  padding: 14px 22px 18px;
  display: flex; gap: 8px;
  background: var(--bg-deep);
}
.btn {
  flex: 1; padding: 12px;
  border: 1px solid var(--ink);
  font-family: 'Inter Tight', sans-serif;
  font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.15s;
}
.btn.primary { background: var(--ink); color: var(--paper); }
.btn.primary:hover { background: var(--red); }
.btn.secondary { background: var(--paper); color: var(--ink); }
.btn.secondary:hover { background: var(--ink); color: var(--paper); }

/* ===================== GUIDE SCREEN ===================== */
.guide-hero {
  padding: 22px 22px 16px;
  border-bottom: 1.5px solid var(--ink);
}
.guide-title {
  font-family: 'Fraunces', serif;
  font-weight: 400; font-size: 32px; line-height: 1;
  letter-spacing: -0.03em;
}
.guide-title em { font-style: italic; font-weight: 300; }
.guide-sub {
  margin-top: 8px;
  font-size: 12px; line-height: 1.5;
  color: var(--ink-soft);
}

.section {
  padding: 16px 22px;
  border-bottom: 1px solid var(--ink);
}
.section-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink-mute); font-weight: 600;
  display: flex; justify-content: space-between; align-items: baseline;
  margin-bottom: 12px;
}
.section-label .num {
  font-family: 'Fraunces', serif;
  font-size: 16px; color: var(--ink);
  letter-spacing: -0.02em;
}
.tier-card {
  padding: 10px 12px;
  margin-bottom: 6px;
  border: 1px solid var(--ink);
  display: grid; grid-template-columns: auto 1fr; gap: 10px;
}
.tier-card:last-child { margin-bottom: 0; }
.tier-badge {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-weight: 700; font-size: 13px;
  color: white; line-height: 1;
}
.tier-badge.g { background: var(--green); }
.tier-badge.y { background: var(--amber); }
.tier-badge.r { background: var(--red); }
.tier-name {
  font-family: 'Fraunces', serif;
  font-weight: 500; font-size: 14px; color: var(--ink);
}
.tier-desc {
  font-size: 11px; line-height: 1.4;
  color: var(--ink-soft); margin-top: 2px;
}

.principle-card {
  padding: 8px 0;
  border-bottom: 1px dashed rgba(0,0,0,0.1);
}
.principle-card:last-child { border-bottom: none; }
.principle-card-head {
  display: flex; gap: 8px; align-items: baseline;
  margin-bottom: 3px;
}
.p-idx {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; color: var(--ink-mute);
}
.p-name {
  font-family: 'Fraunces', serif;
  font-weight: 500; font-size: 13.5px;
}
.p-body {
  font-size: 11.5px; line-height: 1.5;
  color: var(--ink-soft); margin-left: 24px;
}

.disclaimer {
  padding: 12px 22px 18px;
  background: var(--bg-deep);
}
.disclaimer p {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; line-height: 1.6;
  color: var(--ink-soft); letter-spacing: 0.02em;
}

/* ===================== PWA INSTALL BANNER ===================== */
.install-banner {
  position: fixed;
  bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(calc(100% + 40px));
  visibility: hidden;
  z-index: 100;
  background: var(--ink); color: var(--paper);
  padding: 14px 18px;
  display: flex; align-items: center; gap: 14px;
  max-width: 92vw; width: 420px;
  box-shadow: 0 16px 40px -8px rgba(0,0,0,0.4);
  transition: transform 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
  font-family: 'Inter Tight', sans-serif;
}
.install-banner.show { transform: translateX(-50%) translateY(0); visibility: visible; }
.install-banner .ib-icon {
  width: 36px; height: 36px; flex-shrink: 0;
  background: var(--paper); border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fraunces', serif;
  font-weight: 700; font-size: 18px;
  color: var(--ink);
  position: relative;
}
.install-banner .ib-icon::after {
  content: ''; position: absolute;
  top: 6px; right: 6px; width: 6px; height: 6px;
  background: var(--red); border-radius: 50%;
}
.install-banner .ib-body { flex: 1; min-width: 0; }
.install-banner .ib-title {
  font-weight: 600; font-size: 13px;
  letter-spacing: 0.01em;
}
.install-banner .ib-sub {
  font-size: 11px; opacity: 0.72; margin-top: 2px;
  line-height: 1.35;
}
.install-banner .ib-btn {
  padding: 8px 14px; flex-shrink: 0;
  background: var(--paper); color: var(--ink);
  border: none; cursor: pointer;
  font-family: 'Inter Tight', sans-serif;
  font-size: 12px; font-weight: 600;
  letter-spacing: 0.03em;
  transition: background 0.15s;
}
.install-banner .ib-btn:hover { background: var(--red); color: white; }
.install-banner .ib-close {
  background: none; border: none; color: var(--paper);
  opacity: 0.5; cursor: pointer;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px; padding: 4px 8px;
  transition: opacity 0.15s;
}
.install-banner .ib-close:hover { opacity: 1; }

/* iOS-specific install instructions (triggered manually since beforeinstallprompt doesn't fire on iOS) */
.ios-instructions {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: none;
  align-items: flex-end;
  justify-content: center;
  padding: 20px;
}
.ios-instructions.show { display: flex; }
.ios-instructions-panel {
  background: var(--paper);
  max-width: 440px; width: 100%;
  padding: 24px;
  font-family: 'Inter Tight', sans-serif;
  position: relative;
}
.ios-instructions-panel h3 {
  font-family: 'Fraunces', serif;
  font-weight: 500; font-size: 22px;
  letter-spacing: -0.02em;
  margin-bottom: 14px;
}
.ios-instructions-panel ol {
  padding-left: 20px;
  font-size: 14px; line-height: 1.7;
  color: var(--ink-soft);
}
.ios-instructions-panel ol li { margin-bottom: 6px; }
.ios-instructions-panel .share-icon {
  display: inline-block;
  width: 16px; height: 16px;
  border: 1.5px solid var(--ink);
  position: relative;
  vertical-align: -3px; margin: 0 2px;
}
.ios-instructions-panel .share-icon::before {
  content: '↑'; position: absolute;
  top: -6px; left: 0; right: 0;
  text-align: center; font-weight: 700;
  color: var(--ink);
}
.ios-instructions-panel button {
  margin-top: 16px; width: 100%; padding: 12px;
  background: var(--ink); color: var(--paper); border: none;
  font-family: 'Inter Tight', sans-serif; font-weight: 600;
  font-size: 13px; cursor: pointer;
}

/* When installed as PWA: remove side panels, full-bleed phone view */
@media (display-mode: standalone) {
  body { background: var(--paper); }
  .stage {
    padding: 0; gap: 0;
    grid-template-columns: 1fr;
    min-height: 100vh;
    background: var(--paper);
  }
  .side { display: none; }
  .phone {
    width: 100vw; height: 100vh;
    max-width: none;
    border-radius: 0; padding: 0;
    box-shadow: none;
  }
  .phone::before { display: none; }
  .screen { border-radius: 0; }
  .status-bar { display: none; }  /* use device's real status bar */
  /* Safe area for notched phones */
  .app-head { padding-top: calc(12px + env(safe-area-inset-top)); }
  .cta-row { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .install-banner { display: none !important; }
}

/* ===================== RESPONSIVE ===================== */
@media (max-width: 1100px) {
  .stage { grid-template-columns: 1fr; padding: 20px; gap: 28px; }
  .side.left, .side.right { justify-self: center; text-align: center; max-width: 520px; }
}
@media (max-width: 420px) {
  .phone { width: 100%; max-width: 390px; height: 760px; }
  .stage { padding: 10px; }
}

/* On a real phone (or installed), drop the presentation frame: the app IS the screen. */
@media (max-width: 500px) {
  body { background: var(--paper); }
  .stage { padding: 0; gap: 0; grid-template-columns: 1fr; min-height: 100dvh; background: var(--paper); }
  .side { display: none; }
  .phone { width: 100vw; max-width: none; height: 100dvh; border-radius: 0; padding: 0; box-shadow: none; }
  .phone::before { display: none; }
  .screen { border-radius: 0; }
  .status-bar { display: none; }
  .app-head { padding-top: calc(12px + env(safe-area-inset-top)); }
  .cta-row { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
  .analyzing { border-radius: 0; }
}

/* ===================== v1.1 additions ===================== */
.app-head-right { display: flex; gap: 6px; align-items: center; }
.lang-btn {
  padding: 5px 8px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
  font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 0.1em;
  cursor: pointer;
}
.lang-btn:hover { background: var(--ink); color: var(--paper); }
#timer {
  font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
  color: var(--paper); background: var(--ink); padding: 1px 6px; margin-left: 6px;
  font-variant-numeric: tabular-nums;
}
.hero-eye .eye-right { display: flex; align-items: center; }
.sample-note {
  margin-top: 8px; font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--ink-mute); letter-spacing: 0.03em;
}
.src-line {
  padding: 0 22px 14px; font-family: 'JetBrains Mono', monospace; font-size: 9px;
  color: var(--ink-mute); letter-spacing: 0.08em; text-transform: uppercase;
}
.cta-row[hidden] { display: none; }
#result-headline:focus { outline: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 3px solid #2b5fd9; outline-offset: 2px;
}
.symptom-chip, .onset-pill, .scenario-chip, .nav-btn, .lang-btn { min-height: 36px; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div class="stage">

  <aside class="side left">
    <div class="brand"><em>CLAR</em>ity</div>
    <div class="tagline" data-i18n="tagline"></div>
    <div class="problem-frame">
      <div class="problem-label" data-i18n="problemLabel"></div>
      <div class="problem-text" data-i18n="problemText"></div>
    </div>
    <div class="meta-box">
      VERSION 1.1 · PROTOTYPE<br/>
      CONGRESSIONAL APP CHALLENGE 2026 · WA-01<br/>
      ENGLISH · ESPAÑOL<br/>
      PYTHON · TYPESCRIPT
    </div>
  </aside>

  <main class="phone"><div class="screen">

    <div class="status-bar" aria-hidden="true">
      <span id="clock">9:41</span>
      <div class="status-icons">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 4c-4.97 0-9 4.03-9 9h2c0-3.87 3.13-7 7-7s7 3.13 7 7h2c0-4.97-4.03-9-9-9zm0 4c-2.76 0-5 2.24-5 5h2c0-1.66 1.34-3 3-3s3 1.34 3 3h2c0-2.76-2.24-5-5-5z"/></svg>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="18" height="10" rx="2"/><rect x="4" y="9" width="12" height="6" fill="currentColor"/></svg>
      </div>
    </div>

    <header class="app-head">
      <div class="app-logo"><em>C</em>larity</div>
      <div class="app-head-right">
        <nav class="app-nav" aria-label="Main">
          <button type="button" class="nav-btn active" data-view="input" data-i18n="navTriage"></button>
          <button type="button" class="nav-btn" data-view="guide" data-i18n="navGuide"></button>
        </nav>
        <button type="button" class="lang-btn" id="lang-toggle" data-i18n="langToggle" data-i18n-aria="langToggleLabel"></button>
      </div>

    <div id="app-scroll">

        <div class="step" role="group" aria-labelledby="h-step1">

        </div>

        <div class="step" role="group" aria-labelledby="h-step2">

        <div class="step" role="group" aria-labelledby="h-step3">

      <section class="view" id="view-result" aria-live="polite">

      <section class="view" id="view-guide">

        <div class="section">

  </div></main>

  <aside class="side right">
