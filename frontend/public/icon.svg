<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background: matches brand ink color, rounded for iOS, full-bleed for Android maskable -->
  <rect width="512" height="512" fill="#0e0e0c"/>

  <!-- Safe zone for maskable icons is the center 80% (inner 409x409 square).
       All visual elements fit inside a 360x360 centered block. -->

  <!-- "C" mark — Fraunces-inspired italic cut, matching the app logo -->
  <g transform="translate(256 256)">
    <!-- Accent dot (the 'moment' of decision) -->
    <circle cx="68" cy="-80" r="16" fill="#9b1b1b"/>

    <!-- The C, drawn as a thick arc -->
    <path d="M 80 -60
             A 120 120 0 1 0 80 60"
          fill="none"
          stroke="#fafaf6"
          stroke-width="44"
          stroke-linecap="square"
          transform="skewX(-6)"/>

    <!-- Underline tick — the 'clarity' beat -->
    <rect x="-40" y="110" width="120" height="8" fill="#fafaf6"/>
  </g>
</svg>
